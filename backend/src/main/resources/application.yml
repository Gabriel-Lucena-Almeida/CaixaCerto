server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: caixacerto-api

  datasource:
    url: jdbc:sqlite:./data/caixacerto.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:Y2FpeGFjZXJ0by1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLW1pbi0zMi1jaGFycw==}
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 604800000 # 7 days

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

  # Pagination defaults
  page:
    default-size: 20
    max-size: 100

# Logging
logging:
  level:
    br.ufpb.caixacerto: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"